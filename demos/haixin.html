<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海辛 · 界面演示 / Chess</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae8de;color:#2b3e34;font:15px/1.8 'PingFang SC','Microsoft YaHei',sans-serif}header,main,footer{max-width:1320px;margin:auto;padding:22px 36px}header{display:flex;justify-content:space-between;border-bottom:1px solid #c8cbbd}a{color:inherit;text-underline-offset:5px}.eyebrow{font:12px monospace;letter-spacing:.15em;color:#6e7e70}h1{font-size:38px;font-weight:500;margin:10px 0}p{max-width:850px}.intro{display:flex;justify-content:space-between;align-items:end}.label{border:1px solid #a8b4a3;padding:6px 14px;font-size:12px}nav{display:flex;gap:12px;margin:28px 0 18px}button{font:inherit;padding:10px 20px;background:transparent;border:1px solid #afb8a7;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#2e493c;color:#f7f3e7;border-color:#2e493c}button:focus-visible,a:focus-visible{outline:3px solid #b98342;outline-offset:4px}figure{margin:0;background:#f8f8f3;border:1px solid #c5ccbd}img{width:100%;display:block}figcaption{padding:18px 22px;border-top:1px solid #c5ccbd}footer{font-size:13px;color:#687664}.counter{font:12px monospace;float:right}h2{font-size:18px;margin:0 0 6px}#caption{margin:0}main{padding-bottom:0}</style>
<header><a href="/plain.html#haixin">← 返回 Chess 的项目</a><span>HAIXIN / PRODUCT WALKTHROUGH</span></header><main><div class="intro"><div><p class="eyebrow">LOCAL PERSONAL AGENT · ALPHA</p><h1>把对话，接到下一件事。</h1></div><span class="label">界面截图导览 · 非实时 Agent</span></div><p>来自海辛当前仓库的真实前端，用独立编写的示例对话、待办和记忆展示使用流程。所有内容均为预置示例，不包含私人数据，也不调用真实模型。</p><nav aria-label="演示步骤"><button data-step="0" aria-pressed="true">01 一起聊聊</button><button data-step="1" aria-pressed="false">02 我的事情</button><button data-step="2" aria-pressed="false">03 记忆与设置</button></nav><figure><img id="shot" src="/chess-assets/projects/haixin-chat.png" alt="海辛一起聊聊界面，展示预置示例对话"><figcaption aria-live="polite"><span class="counter" id="counter">01 / 03</span><h2 id="title">从一句话开始</h2><p id="caption">用对话梳理想法，右侧保留值得接着聊的事情。这里的回答与主动消息均为预置示例。</p></figcaption></figure><p><a href="https://github.com/haidarkhanuk3344-collab/haixin-agent" target="_blank" rel="noopener">查看源码与本地运行说明 ↗</a></p></main><footer>macOS 本地 Alpha · 完整使用需配置模型与本地后台；睡眠或关机期间不保证提醒送达。</footer><script>
const steps=[['chat','从一句话开始','用对话梳理想法，右侧保留值得接着聊的事情。这里的回答与主动消息均为预置示例。'],['tasks','让事情有可追踪的状态','日程、待办和笔记放在「我的事情」里。当前示例展示一条待办，以及调整、完成和取消等实际界面入口。'],['memory','记住，也可以更正或忘记','区分长期背景与近期情况，并保留来源、时间和版本。示例展示一条长期记忆，内容由本次演示独立编写。']];document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.step),s=steps[n];document.querySelectorAll('[data-step]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#shot').src='/chess-assets/projects/haixin-'+s[0]+'.png';document.querySelector('#shot').alt='海辛界面演示：'+s[1];document.querySelector('#title').textContent=s[1];document.querySelector('#caption').textContent=s[2];document.querySelector('#counter').textContent='0'+(n+1)+' / 03';}));
</script></html>
